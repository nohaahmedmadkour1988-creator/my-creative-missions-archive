[`${ornament}<div class="eyebrow">Mission File No. 01</div><img class="coverArt" src="${cover}" alt="The Brand Saver holding the Creative Missions Archive book"><div class="ribbon">A NEW MISSION UNFOLDS</div>`,`${ornament}<div class="eyebrow">Brand Strategy & Positioning · Egyptian Market</div><h2 class="title">ARCHOVA</h2><div class="orn">✦ ☾ ✦</div><img class="character" src="${character}" alt="The Brand Saver character"><div class="ribbon">One brand. Two audiences.<br>Two strategic directions.</div>`],
[`${ornament}<div class="eyebrow">Chapter I</div><div class="ribbon">THE CHALLENGE</div><div class="orn">⚒</div><p class="text">Build a distinctive position for one construction and engineering brand serving both <strong>businesses (B2B)</strong> and <strong>individual customers (B2C).</strong></p><div class="line"></div><div class="text" style="font-style:italic">Two audiences. One identity.</div>`,`${ornament}<div class="eyebrow">Chapter II</div><div class="ribbon">THE INSIGHT</div><p class="text">Both audiences value <strong>trust</strong>, but for different reasons.</p><div class="duo"><div><b>♜ B2B</b>Businesses need a reliable engineering partner.</div><div><b>⌂ B2C</b>Individuals need guidance and reassurance throughout their construction journey.</div></div>`],

let index=0,busy=false;const left=document.getElementById('left'),right=document.getElementById('right'),flip=document.getElementById('flip'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');function render(){left.innerHTML=spreads[index][0];right.innerHTML=spreads[index][1];counter.textContent=`${index+1} / ${spreads.length}`;prev.disabled=index===0;next.disabled=index===spreads.length-1;document.getElementById('edgePrev').disabled=index===0;document.getElementById('edgeNext').disabled=index===spreads.length-1}function go(d){if(busy||index+d<0||index+d>=spreads.length)return;busy=true;if(d>0){flip.classList.remove('active');void flip.offsetWidth;flip.classList.add('active');setTimeout(()=>{index++;render();flip.classList.remove('active');busy=false},900)}else{index--;render();busy=false}}prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.getElementById('edgePrev').onclick=()=>go(-1);document.getElementById('edgeNext').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});render();
